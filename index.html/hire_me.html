<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio - Hire Me</title>
  <style>
    body{
        background-color: #081b29;
    }
    *{
    margin: 0;
    padding: 0;
    font-family: 'Poppins',sans-serif;
    }
        .header{
    position: fixed;
    top: 0;
    left: 0;
    width: 80%;
    padding: 20px 10%;
    background: transparent;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;

    }
        .logo{
    position: relative;
    font-size: 25px;
    color: #ededed;
    text-decoration: none;
    font-weight: 600;
    transition: .3s;
    }
    .logo ::before{
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 100%;
    height: 100%;
    }
    .navbar a{
    font-size: 18px;
    color: #ededed;
    text-decoration: none;
    font-weight: 500;
    margin-left: 60px;
    transition: .3s;
    }
    .navbar a:hover,
    .navbar a.active {
    color: #00abf0;
    }
    .home{
    height: 100vh;
    display: flex;
    align-items: center;
    padding: 0 10%;
    }
    .home-content {
    max-width: 600px;
    text-align: left;
    }
    .home-content h1 {
    font-size: 56px;
    font-weight: 700;
    line-height: 1,2;
    }
    .home-content h3 {
    font-size: 32px;
    font-weight: 700;
    color: #00abf0;
    }
    .home-content p {
    font-size: 16px;
    margin: 20px 0 40px;
    }
    .home-content .btn-box {
    display: flex;
    justify-content: space-between;
    width: 345px;
    height: 50px;
    }
    .home-sci {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    justify-content: space-between;
    width: 170px;
    z-index: 100;
    }
    
    .home-sci a {
    position: relative;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: 40px;
    height: 40px;
    background: transparent;
    border: 2px solid #00abf0;
    border-radius: 50%;
    font-size: 20px;
    color: #00abf0;
    text-decoration: none;
    z-index: 1;
    overflow: hidden;
    transition: .5s;
    }
    
    .home-sci a:hover {
    color: #081b29;
    }
    
    .home-sci a::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 100%;
    background: #00abf0;
    z-index: -2;
    transition: .5s;
    }
    
    .home-sci a:hover:before {
    width: 100%;
    }
    /* Style for the "Hire Me" button */
    .hire-btn {
      padding: 10px 20px;
      background-color: #081b29;
      color: #046f99;
      font-size: 18px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    .hire-btn:hover {
      background-color: #1a2a39;
    }

    /* Style for the contact form */
    #contact-form {
      margin-top: 3.5cm;
      background-color: #2ab4eb;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    #contact-form input, #contact-form textarea {
      width: 95%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid transparent;
      border-radius: 4px;
    }

    #contact-form button[type="submit"] {
      background-color: #15546d(5, 41, 66);
      color: #00abf0;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }

    #contact-form button[type="submit"]:hover {
      background-color: #081b29;
    }
  </style>
</head>
<body>
    <header class="header">
        <!--Head of my web-->
         <a href="index.html" class="logo">John.</a>
        <!--navagation bar of my web-->
         <nav class="navbar">
             <a href="index.html" class="active">Home</a>
             <a href="about.html">About</a>
             <!--<a href="service.html">Service</a>-->
             <a href="portfolio.html">Portforlio</a>
              <a href="https://www.facebook.com/john.mark.timkang.cariaga">Contact</a>

         </nav>
 
     </header>

  <!-- Portfolio Section with "Hire Me" Button -->
  <section id="portfolio">
    <!-- Visible Contact Form -->
    <div id="contact-form">
      <h3>Contact Me</h3>
      <br>
      <form action="/submit-form" method="post">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name"><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br>
        <label for="project">Project Details:</label><br>
        <textarea id="project" name="project"></textarea><br>
        <button type="submit">Submit</button>
      </form>
    </div>
  </section>

  <script>
    // JavaScript function to open and show the contact form when "Hire Me" is clicked
    function openContactForm() {
      const contactForm = document.getElementById('contact-form');
      contactForm.style.display = 'block'; // Form is shown immediately after button click
    }
  </script>

</body>
</html>
